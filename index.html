<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tour Dashboard</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #eef2ff, #f8fafc);
  padding:15px;
  color:#1f2937;
}

/* HEADER */
h1{
  text-align:center;
  margin:15px 0 25px;
  font-size:28px;
  background: linear-gradient(90deg,#6366f1,#06b6d4);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

h2{
  margin:20px 0 10px;
  font-size:18px;
  color:#111827;
}

/* GRID */
.grid{
  display:grid;
  gap:12px;
}

/* MEMBERS */
.members-grid{
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
}

.member-card{
  background:#ffffff;
  border-radius:14px;
  padding:14px;
  box-shadow:0 10px 25px rgba(0,0,0,.06);
  cursor:pointer;
  transition:.25s;
  border:1px solid #eef2f7;
}

.member-card:hover{
  transform:translateY(-5px);
  box-shadow:0 15px 30px rgba(0,0,0,.10);
}

.member-name{
  font-weight:700;
  color:#4f46e5;
  margin-bottom:6px;
}

/* SUMMARY */
.summary-grid{
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
}

.summary-card{
  background:#fff;
  padding:16px;
  border-radius:14px;
  box-shadow:0 10px 25px rgba(0,0,0,.06);
  text-align:center;
  border:1px solid #eef2f7;
}

.summary-card h3{
  font-size:13px;
  color:#6b7280;
}

.summary-card p{
  font-size:20px;
  font-weight:800;
  margin-top:6px;
}

/* COLORS */
.total-given{
  border-left:5px solid #3b82f6;
}

.total-expenses{
  border-left:5px solid #ef4444;
}

.remaining{
  border-left:5px solid #22c55e;
}

.per-person{
  border-left:5px solid #f59e0b;
}

/* EXPENSES */
.expense-grid{
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
}

.expense-card{
  background:#fff;
  padding:12px 14px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,.06);
  display:flex;
  justify-content:space-between;
  border:1px solid #eef2f7;
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.6);
  justify-content:center;
  align-items:center;
  padding:20px;
}

.modal-content{
  background:#fff;
  width:100%;
  max-width:420px;
  border-radius:16px;
  padding:20px;
  box-shadow:0 20px 40px rgba(0,0,0,.2);
  position:relative;
}

.close{
  position:absolute;
  right:15px;
  top:10px;
  font-size:26px;
  cursor:pointer;
  color:#6b7280;
}

.modal h2{
  margin-bottom:10px;
  color:#4f46e5;
}

.modal p{
  background:#f9fafb;
  padding:10px;
  border-radius:10px;
  margin:8px 0;
}

</style>
</head>

<body>

<h1 id="title">Loading...</h1>

<h2>Members</h2>
<div class="grid members-grid" id="members"></div>

<h2>Summary</h2>
<div class="grid summary-grid" id="summary"></div>

<h2>Expenses</h2>
<div class="grid expense-grid" id="expenses"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" id="close">&times;</span>
    <h2 id="mName"></h2>
    <p><b>Given:</b> <span id="mGiven"></span></p>
    <p><b>Have To Pay:</b> <span id="mPay"></span></p>
  </div>
</div>

<script>

const url = "https://docs.google.com/spreadsheets/d/1kMv6C7xlD64hhJFb9yJdFxUp6AX1jXM96HaC_BCRbNM/export?format=csv&gid=0";

function clean(v){
  return (v||"").replace(/^"(.*)"$/,'$1');
}

fetch(url)
.then(r=>r.text())
.then(csv=>{

  const rows = csv.trim().split("\n").map(r=>r.split(",").map(clean));

  document.getElementById("title").innerText = rows[0][0];

  // MEMBERS
  const members = rows.slice(3,12).map(r=>r.slice(0,3));

  document.getElementById("members").innerHTML =
    members.map(m=>`
      <div class="member-card"
        data-name="${m[0]}"
        data-given="${m[1]}"
        data-pay="${m[2]}">

        <div class="member-name">${m[0]}</div>
        <div>💰 Given: ${m[1]}</div>
        <div>📌 Pay: ${m[2]}</div>
      </div>
    `).join("");

  // EXPENSES
  let expenses=[];
  for(let i=18;i<rows.length;i++){
    if(rows[i][0]) expenses.push(rows[i].slice(0,2));
  }

  document.getElementById("expenses").innerHTML =
    expenses.map(e=>`
      <div class="expense-card">
        <span>${e[0]}</span>
        <b>৳ ${e[1]}</b>
      </div>
    `).join("");

  const totalExpenses = expenses.reduce((s,e)=>s+(+e[1]||0),0);

  const get=(r,c)=>rows[r]?.[c]||"";

  // SUMMARY
  document.getElementById("summary").innerHTML=`
    <div class="summary-card total-given">
      <h3>Total Given</h3>
      <p>৳ ${get(5,4)}</p>
    </div>

    <div class="summary-card total-expenses">
      <h3>Total Expenses</h3>
      <p>৳ ${totalExpenses}</p>
    </div>

    <div class="summary-card remaining">
      <h3>Remaining</h3>
      <p>৳ ${get(8,4)}</p>
    </div>

    <div class="summary-card per-person">
      <h3>Per Person</h3>
      <p>৳ ${get(5,5)}</p>
    </div>
  `;

  // MODAL
  const modal=document.getElementById("modal");

  document.querySelectorAll(".member-card").forEach(el=>{
    el.onclick=()=>{
      document.getElementById("mName").innerText=el.dataset.name;
      document.getElementById("mGiven").innerText=el.dataset.given;
      document.getElementById("mPay").innerText=el.dataset.pay;
      modal.style.display="flex";
    }
  });

  document.getElementById("close").onclick=()=>modal.style.display="none";
  modal.onclick=(e)=>{if(e.target===modal) modal.style.display="none";};

});

</script>

</body>
</html>
